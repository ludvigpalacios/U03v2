<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="js/Leaderboard/script.js"></script>
    <title>BrainRush</title>
</head>

<body>
    <main>
        <section class="leaderboard-intro">
            <div>
                <p class="players">All players</p>
                <h1>Leaderboard</h1>
                <p class="intro">Example players and real quiz results saved on this device.</p>
            </div>
            <div class="season">
                <p>Current Season</p>
                <strong>Spring Sprint</strong>
            </div>
        </section>
        <section id="leaderboard-podium" class="podium" aria-label="Top three players"></section>
        <p id="leaderboard-empty" class="leaderboard-message" hidden>No saved scores yet. Finish a quiz to appear here.</p>
        <p id="leaderboard-status" class="leaderboard-message" role="status"></p>

        <div class="leaderboard" role="table" aria-label="Top 10 players">
            <div class="leaderboard-row leaderboard-heading" role="row">
                <span role="columnheader">Rank</span>
                <span role="columnheader">Player</span>
                <span role="columnheader">Quizzes</span>

                <div class="scoreheader" role="columnheader">
                    <span>Best Score</span>

                    <button id="refresh-button" class="reload-button" type="button" aria-label="Refresh leaderboard"
                        title="Refresh leaderboard">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5" />
                        </svg>
                    </button>
                </div>

            </div>

            <div id="leaderboard-body" role="rowgroup"></div>
        </div>
    </main>

    <footer></footer>
</body>

</html>
