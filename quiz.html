<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRush – Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <main>
        <!-- Start: choose a category -->
        <section id="start-view">
            <h1>Choose your challenge</h1>
            <p>5 questions · 10 seconds each · 3 tries</p>
            <div class="categories">
                <button type="button" class="category-button" data-category="logical">Logical</button>
                <button type="button" class="category-button" data-category="creative">Creative</button>
            </div>
        </section>

        <!-- Quiz: one question at a time -->
        <section id="quiz-view" hidden>
            <div class="quiz-top">
                <p id="quiz-progress"></p>
                <p>Time left: <span id="quiz-timer">10 s</span></p>
            </div>
            <h2 id="quiz-question" tabindex="-1"></h2>
            <p id="quiz-word"></p>
            <ul id="quiz-answers"></ul>
            <p id="quiz-feedback" aria-live="polite"></p>
        </section>

        <!-- Result -->
        <section id="result-view" hidden>
            <h2 id="result-text" tabindex="-1"></h2>
            <button type="button" id="play-again">Back to start</button>
        </section>
    </main>

    <script type="module" src="quiz.js"></script>
</body>
</html>
