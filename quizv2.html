
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRush - Quiz</title>
<link rel="stylesheet" href="quiz.css?v=2">
</head>
<body>
  <main class="quiz-main">

    <section id="start-view">
      <div class="quiz-panel">
        <span class="eyebrow">BRAiNRUSH CHALLENGE</span>
        <h1>Choose your challenge</h1>
        <p>10 questions · 10 seconds each</p>

        <div class="categories">
          <button class="category-button" data-category="logical">
            🧠 Logical Challenge
          </button>
          <button class="category-button" data-category="creative">
            ✨ Creative Challenge
          </button>
        </div>
      </div>
    </section>

    <section id="quiz-view" hidden>
      <div class="quiz-panel">
        <div class="quiz-top">
          <span id="category-name"></span>
          <span id="quiz-progress">1/10</span>
        </div>

        <div class="progress-track">
          <div id="progress-fill"></div>
        </div>

        <div class="quiz-stats">
          <span>Answered: <b id="answered-count">0</b></span>
          <span>Score: <b id="score-count">0</b></span>
          <span>Time: <b id="quiz-timer">10s</b></span>
        </div>

        <h2 id="quiz-question"></h2>

        <div id="quiz-answers" class="answers"></div>

        <p id="quiz-feedback" aria-live="polite"></p>

        <button id="next-button" hidden>Next Question</button>
      </div>
    </section>

    <section id="result-view" hidden>
      <div class="quiz-panel result-panel">
        <div class="trophy">🏆</div>
        <h1>Quiz Completed!</h1>
        <p id="result-category"></p>

        <div class="result-score" id="result-fraction">0/10</div>
        <p id="result-percentage">0% correct answers</p>

        <div class="result-grid">
          <div class="result-stat">
            <strong id="result-answered">0</strong>
            <span>Answered</span>
          </div>
          <div class="result-stat">
            <strong id="result-correct">0</strong>
            <span>Correct</span>
          </div>
          <div class="result-stat">
            <strong id="result-wrong">0</strong>
            <span>Incorrect</span>
          </div>
        </div>

        <p class="final-points">
          Total Points: <strong id="result-points">0</strong>
        </p>

        <button id="play-again">Play Again</button>
      </div>
    </section>

  </main>

  <script src="js/quiz/quizv2.js" defer></script>
</body>
</html>
